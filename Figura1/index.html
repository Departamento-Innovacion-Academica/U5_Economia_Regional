<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mercado de Capitales</title>

  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       GENERAL
    ========================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family: "Poppins", sans-serif;
    }

    body {
      background: #ffffff;

      padding: 20px;

      overflow-x: hidden;

      /* 🔹 CENTRADO VERTICAL Y HORIZONTAL */
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================================
       DIAGRAMA
    ========================================== */

    .diagrama {
      position: relative;

      width: 100%;
      max-width: 950px;    /* 🔹 antes 1400px */

      height: 560px;       /* 🔹 antes 820px */

      margin: 0 auto;
    }


    /* =========================================
       BLOQUES
    ========================================== */

    .bloque {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: #ffffff;

      border-radius: 20px;   /* 🔹 antes 30px */

      padding: 14px;         /* 🔹 antes 20px */

      z-index: 2;

      opacity: 0;

      /* 🔹 ANIMACIÓN MÁS LENTA (antes 0.9s) */
      animation:
        aparecer
        1.8s
        cubic-bezier(.22,1,.36,1)
        forwards;
    }


    @keyframes aparecer {

      from {
        opacity: 0;
        transform: scale(.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================
       MERCADO DE CAPITALES
    ========================================== */

    .mercado {
      width: 230px;        /* 🔹 antes 340px */
      height: 120px;       /* 🔹 antes 180px */

      left: 0;
      top: 210px;          /* 🔹 antes 310px */

      background: #032B4D;

      font-size: 1.3rem;   /* 🔹 antes 1.9rem */

      font-weight: 700;

      line-height: 1.2;

      animation-delay: .2s;
    }


    /* =========================================
       INTERMEDIADO BANCARIO
    ========================================== */

    .intermediado {
      width: 245px;        /* 🔹 antes 360px */
      height: 120px;       /* 🔹 antes 180px */

      left: 290px;         /* 🔹 antes 430px */
      top: 115px;          /* 🔹 antes 170px */

      background: #3F6F98;

      font-size: 1rem;     /* 🔹 antes 1.45rem */

      font-weight: 400;

      animation-delay: 1s;
    }


    /* =========================================
       NO INTERMEDIADO
    ========================================== */

    .no-intermediado {
      width: 245px;        /* 🔹 antes 360px */
      height: 120px;       /* 🔹 antes 180px */

      left: 290px;         /* 🔹 antes 430px */
      top: 355px;          /* 🔹 antes 520px */

      background: #3F6F98;

      font-size: .95rem;   /* 🔹 antes 1.4rem */

      font-weight: 400;

      animation-delay: 1.4s;
    }


    /* =========================================
       BLOQUES DERECHA
    ========================================== */

    .derecha {
      width: 175px;        /* 🔹 antes 255px */
      height: 100px;       /* 🔹 antes 150px */

      right: 0;

      background: #49419B;

      font-size: .78rem;   /* 🔹 antes 1.12rem */

      font-weight: 400;

      line-height: 1.18;

      transform: translateX(90px);

      animation-name: entrarDerecha;
    }


    @keyframes entrarDerecha {

      from {
        opacity: 0;
        transform: translateX(90px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }


    .derecha-1 {
      top: 6px;
      animation-delay: 2s;
    }

    .derecha-2 {
      top: 122px;
      animation-delay: 2.4s;
    }

    .derecha-3 {
      top: 238px;
      animation-delay: 2.8s;
    }

    .derecha-4 {
      top: 354px;
      animation-delay: 3.2s;
    }

    .mercado-valores {
      top: 470px;

      font-weight: 700;

      animation-delay: 3.6s;
    }


    /* =========================================
       SVG DE LÍNEAS
    ========================================== */

    .lineas {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      overflow: visible;
    }


    .linea {
      stroke: #032B4D;

      stroke-width: 5;     /* 🔹 antes 8 */

      fill: none;

      stroke-linecap: square;

      stroke-dasharray: 1000;

      stroke-dashoffset: 1000;

      /* 🔹 MÁS LENTO (antes 1s) */
      animation:
        dibujarLinea
        2.2s
        ease
        forwards;
    }


    @keyframes dibujarLinea {

      to {
        stroke-dashoffset: 0;
      }

    }


    .linea-1 { animation-delay: .5s; }
    .linea-2 { animation-delay: .8s; }
    .linea-3 { animation-delay: 1.7s; }
    .linea-4 { animation-delay: 2s; }
    .linea-5 { animation-delay: 2.3s; }
    .linea-6 { animation-delay: 2.6s; }
    .linea-7 { animation-delay: 2.9s; }


    /* =========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 1050px) {

      .diagrama {
        height: auto;

        display: flex;

        flex-direction: column;

        gap: 14px;
      }


      .bloque {
        position: relative;

        top: auto;
        left: auto;
        right: auto;

        width: 100%;

        min-height: 80px;

        height: auto;

        font-size: .85rem;
      }


      .lineas {
        display: none;
      }

    }


    /* =========================================
       ACCESIBILIDAD
    ========================================== */

    @media (prefers-reduced-motion: reduce) {

      .bloque,
      .linea {
        animation: none !important;

        opacity: 1;

        transform: none;

        stroke-dashoffset: 0;
      }

    }

  </style>
</head>


<body>

  <main class="diagrama">


    <!-- =====================================
         LÍNEAS
    ====================================== -->

    <svg
      class="lineas"
      viewBox="0 0 950 560"
      preserveAspectRatio="none"
    >

      <!-- MERCADO DE CAPITALES → intermediado -->
      <path
        class="linea linea-1"
        d="M230 270 L290 175"
      />

      <!-- MERCADO DE CAPITALES → no intermediado -->
      <path
        class="linea linea-2"
        d="M230 270 L290 415"
      />

      <!-- INTERMEDIADO → bloque 1 -->
      <path
        class="linea linea-3"
        d="M535 175 L775 56"
      />

      <!-- INTERMEDIADO → bloque 2 -->
      <path
        class="linea linea-4"
        d="M535 175 L775 172"
      />

      <!-- INTERMEDIADO → bloque 3 -->
      <path
        class="linea linea-5"
        d="M535 175 L775 288"
      />

      <!-- INTERMEDIADO → bloque 4 -->
      <path
        class="linea linea-6"
        d="M535 175 L775 404"
      />

      <!-- NO INTERMEDIADO → mercado de valores -->
      <path
        class="linea linea-7"
        d="M535 415 L775 520"
      />

    </svg>



    <!-- =====================================
         MERCADO DE CAPITALES
    ====================================== -->

    <section class="bloque mercado">

      MERCADO DE
      <br>
      CAPITALES

    </section>



    <!-- =====================================
         INTERMEDIADO BANCARIO
    ====================================== -->

    <section class="bloque intermediado">

      INTERMEDIADO
      <br>
      BANCARIO

    </section>



    <!-- =====================================
         NO INTERMEDIADO
    ====================================== -->

    <section class="bloque no-intermediado">

      NO INTERMEDIADO
      <br>
      NO BANCARIO

    </section>



    <!-- =====================================
         DERECHA
    ====================================== -->

    <section class="bloque derecha derecha-1">
      Establecimientos
      <br>
      de Crédito
    </section>


    <section class="bloque derecha derecha-2">
      Establecimientos
      <br>
      de Crédito
    </section>


    <section class="bloque derecha derecha-3">
      Establecimientos
      <br>
      de Crédito
    </section>


    <section class="bloque derecha derecha-4">
      Establecimientos
      <br>
      de Crédito
    </section>



    <!-- =====================================
         MERCADO DE VALORES
    ====================================== -->

    <section class="bloque derecha mercado-valores">

      Mercado de
      <br>
      Valores

    </section>


  </main>

</body>
</html>
