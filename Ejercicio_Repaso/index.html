<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ejercicios de Repaso</title>

  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================
       GENERAL
    ====================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family: "Poppins", sans-serif;
    }

    :root {
      --azul-oscuro: #03223D;
      --azul-medio: #356389;
      --verde: #2E7D32;
      --verde-claro: #E8F5E9;
      --rojo: #C62828;
      --rojo-claro: #FDECEA;
    }

    body {
      background:
        radial-gradient(circle at 10% 0%, #eef3fa 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, #e8eef5 0%, transparent 40%),
        #f7f9fc;

      color: var(--azul-oscuro);

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
    }


    /* =====================================
       CONTENEDOR
    ====================================== */

    .quiz {
      width: 100%;
      max-width: 980px;

      background: #ffffff;

      border-radius: 28px;

      padding: 40px;

      box-shadow:
        0 20px 50px
        rgba(3, 34, 61, 0.10),
        0 4px 12px
        rgba(3, 34, 61, 0.04);

      position: relative;

      overflow: hidden;
    }

    /* 🔹 Franja decorativa superior con gradiente */
    .quiz::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 6px;

      background:
        linear-gradient(
          90deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );
    }


    /* =====================================
       ENCABEZADO
    ====================================== */

    .encabezado {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 22px;
    }

    .titulo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .titulo-icono {
      width: 42px;
      height: 42px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-size: 1.3rem;

      box-shadow:
        0 6px 14px
        rgba(3, 34, 61, 0.25);
    }

    .titulo {
      color: var(--azul-oscuro);

      font-size: clamp(1.3rem, 2.4vw, 1.8rem);

      font-weight: 700;

      line-height: 1.2;
    }

    .subtitulo {
      color: var(--azul-medio);

      font-size: .82rem;

      font-weight: 500;
    }

    .contador {
      flex-shrink: 0;

      background:
        linear-gradient(
          135deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      color: #ffffff;

      border-radius: 30px;

      padding: 8px 18px;

      font-size: .85rem;

      font-weight: 600;

      box-shadow:
        0 6px 14px
        rgba(3, 34, 61, 0.20);
    }


    /* =====================================
       BARRA DE PROGRESO
    ====================================== */

    .progreso {
      width: 100%;
      height: 8px;

      background: #e8edf5;

      border-radius: 20px;

      overflow: hidden;

      margin-bottom: 28px;
    }

    .progreso-barra {
      height: 100%;

      width: 0%;

      background:
        linear-gradient(
          90deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      border-radius: 20px;

      transition: width .5s cubic-bezier(.22,1,.36,1);
    }


    /* =====================================
       INSTRUCCIÓN
    ====================================== */

    .instruccion {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      background: #eef3fa;

      color: var(--azul-oscuro);

      border-radius: 30px;

      padding: 8px 16px;

      margin-bottom: 22px;

      font-size: .82rem;

      font-weight: 600;
    }

    .instruccion::before {
      content: "💡";
      font-size: .95rem;
    }


    /* =====================================
       PREGUNTA
    ====================================== */

    .pregunta {
      margin-bottom: 26px;

      color: #1a1a1a;

      font-size: clamp(1.02rem, 1.7vw, 1.22rem);

      line-height: 1.6;

      font-weight: 500;
    }

    .pregunta-numero {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 28px;
      height: 28px;

      border-radius: 8px;

      background: var(--azul-oscuro);

      color: #ffffff;

      font-size: .85rem;

      font-weight: 700;

      margin-right: 10px;

      vertical-align: middle;
    }


    /* =====================================
       OPCIONES
    ====================================== */

    .opciones {
      display: grid;

      grid-template-columns: 1fr;

      gap: 12px;

      margin-bottom: 22px;
    }

    .opcion {
      position: relative;

      width: 100%;

      border: 2px solid #dbe3ef;

      border-radius: 16px;

      background: #ffffff;

      color: var(--azul-oscuro);

      padding: 15px 18px 15px 56px;

      font-family: "Poppins", sans-serif;

      font-size: .95rem;

      font-weight: 500;

      line-height: 1.45;

      text-align: left;

      cursor: pointer;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    /* Letra (A, B, C, D) */
    .opcion::before {
      content: attr(data-letra);

      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      width: 30px;
      height: 30px;

      border-radius: 10px;

      background: #eef3fa;

      color: var(--azul-oscuro);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: .82rem;

      font-weight: 700;

      transition:
        background .25s ease,
        color .25s ease;
    }

    .opcion:hover:not(:disabled) {
      border-color: var(--azul-medio);

      background: #f4f8fd;

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px
        rgba(3, 34, 61, 0.08);
    }

    .opcion:hover:not(:disabled)::before {
      background: var(--azul-medio);

      color: #ffffff;
    }

    .opcion:disabled {
      cursor: default;
    }


    /* =====================================
       CORRECTA / INCORRECTA
    ====================================== */

    .opcion.correcta {
      background: var(--verde-claro);

      border-color: var(--verde);

      color: var(--verde);
    }

    .opcion.correcta::before {
      content: "✓";

      background: var(--verde);

      color: #ffffff;
    }

    .opcion.incorrecta {
      background: var(--rojo-claro);

      border-color: var(--rojo);

      color: var(--rojo);
    }

    .opcion.incorrecta::before {
      content: "✕";

      background: var(--rojo);

      color: #ffffff;
    }


    /* =====================================
       REALIMENTACIÓN
    ====================================== */

    .realimentacion {
      display: none;

      margin-top: 15px;

      padding: 22px 24px;

      background:
        linear-gradient(
          135deg,
          #f6f8fc,
          #eef3fa
        );

      border-left: 6px solid var(--azul-medio);

      border-radius: 16px;
    }

    .realimentacion.visible {
      display: block;

      animation:
        aparecer
        .45s ease;
    }

    @keyframes aparecer {

      from {
        opacity: 0;

        transform: translateY(15px);
      }

      to {
        opacity: 1;

        transform: translateY(0);
      }

    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 14px;

      padding: 6px 14px;

      border-radius: 30px;

      font-size: .85rem;

      font-weight: 700;
    }

    .estado.correcto {
      background: var(--verde-claro);

      color: var(--verde);
    }

    .estado.correcto::before {
      content: "🎉";
    }

    .estado.incorrecto {
      background: var(--rojo-claro);

      color: var(--rojo);
    }

    .estado.incorrecto::before {
      content: "📌";
    }

    .realimentacion h3 {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 8px;

      color: var(--azul-oscuro);

      font-size: .95rem;

      font-weight: 700;
    }

    .realimentacion h3::before {
      content: "📖";
    }

    .realimentacion p {
      color: #333333;

      font-size: .93rem;

      line-height: 1.7;
    }


    /* =====================================
       BOTÓN SIGUIENTE
    ====================================== */

    .acciones {
      display: flex;
      justify-content: flex-end;

      margin-top: 24px;
    }

    .siguiente {
      display: none;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      color: #ffffff;

      padding: 13px 26px;

      font-family: "Poppins", sans-serif;

      font-size: .95rem;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(3, 34, 61, 0.25);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .siguiente.visible {
      display: inline-flex;

      align-items: center;

      gap: 9px;
    }

    .siguiente:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px
        rgba(3, 34, 61, 0.30);
    }

    .siguiente span {
      transition: transform .25s ease;
    }

    .siguiente:hover span {
      transform: translateX(4px);
    }


    /* =====================================
       RESULTADO FINAL
    ====================================== */

    .resultado-final {
      display: none;

      text-align: center;

      padding: 25px 10px;
    }

    .resultado-final.visible {
      display: block;

      animation:
        aparecer
        .5s ease;
    }

    .trofeo {
      width: 80px;
      height: 80px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 18px;

      font-size: 2.2rem;

      box-shadow:
        0 12px 30px
        rgba(3, 34, 61, 0.35);
    }

    .resultado-final h2 {
      margin-bottom: 14px;

      color: var(--azul-oscuro);

      font-size: clamp(1.4rem, 2.8vw, 2rem);

      font-weight: 700;
    }

    .puntaje {
      margin-bottom: 8px;

      background:
        linear-gradient(
          135deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      background-clip: text;

      font-size: clamp(2.8rem, 7vw, 4.2rem);

      font-weight: 700;
    }

    .resultado-final p {
      margin-bottom: 24px;

      color: #444444;

      font-size: 1rem;
    }

    .reiniciar {
      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--azul-oscuro),
          var(--azul-medio)
        );

      color: #ffffff;

      padding: 13px 28px;

      font-family: "Poppins", sans-serif;

      font-size: .95rem;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(3, 34, 61, 0.25);

      transition:
        transform .25s ease;
    }

    .reiniciar:hover {
      transform: translateY(-2px);
    }


    /* =====================================
       RESPONSIVE
    ====================================== */

    @media (max-width: 650px) {

      .quiz {
        padding: 26px 20px;
      }

      .encabezado {
        flex-direction: column;
        align-items: flex-start;
      }

      .opcion {
        font-size: .88rem;

        padding-left: 52px;
      }

      .realimentacion {
        padding: 18px;
      }

      .titulo-icono {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }
    }

  </style>
</head>


<body>

  <main class="quiz">


    <!-- =====================================
         EJERCICIO
    ====================================== -->

    <section id="areaQuiz">


      <!-- ENCABEZADO -->

      <div class="encabezado">

        <div class="titulo-wrap">

          <div class="titulo-icono">📝</div>

          <div>

            <h1 class="titulo">
              Ejercicios de Repaso
            </h1>

            <p class="subtitulo">
              Sistema financiero y fintech
            </p>

          </div>

        </div>

        <div class="contador" id="contador">
          1 de 6
        </div>

      </div>


      <!-- BARRA DE PROGRESO -->

      <div class="progreso">
        <div class="progreso-barra" id="progresoBarra"></div>
      </div>


      <!-- INSTRUCCIÓN -->

      <div class="instruccion" id="instruccion">
        Seleccione la respuesta correcta.
      </div>


      <!-- PREGUNTA -->

      <div class="pregunta" id="pregunta"></div>


      <!-- OPCIONES -->

      <div class="opciones" id="opciones"></div>


      <!-- REALIMENTACIÓN -->

      <div class="realimentacion" id="realimentacion">

        <div class="estado" id="estado"></div>

        <h3>Realimentación</h3>

        <p id="textoRealimentacion"></p>

      </div>


      <!-- ACCIONES -->

      <div class="acciones">

        <button type="button" class="siguiente" id="siguiente">
          Siguiente
          <span>→</span>
        </button>

      </div>


    </section>



    <!-- =====================================
         RESULTADO FINAL
    ====================================== -->

    <section class="resultado-final" id="resultadoFinal">

      <div class="trofeo">🏆</div>

      <h2>¡Resultado final!</h2>

      <div class="puntaje" id="puntaje">0/6</div>

      <p id="mensajeResultado"></p>

      <button type="button" class="reiniciar" id="reiniciar">
        Intentar nuevamente
      </button>

    </section>

  </main>



  <script>

    /* =====================================
       EJERCICIOS
    ====================================== */

    const ejercicios = [

      {
        tipo: "multiple",
        enunciado: `¿En qué tipo de contrato forward existe un movimiento real de flujos en el vencimiento?`,
        opciones: [
          "Forward Delivery.",
          "Non Delivery.",
          "En todo contrato forward.",
          "En ningún contrato forward."
        ],
        correcta: 0,
        realimentacion: `El Forward Delivery implica la entrega física del activo subyacente o el intercambio efectivo de los flujos pactados al momento del vencimiento del contrato. En contraste, el Non-Delivery Forward (NDF) no contempla la entrega física del activo; únicamente se liquida la diferencia entre el precio pactado y el precio de mercado mediante una compensación monetaria. Estos instrumentos son ampliamente utilizados para cubrir riesgos cambiarios y financieros, permitiendo a las partes fijar un precio futuro y reducir la incertidumbre frente a las fluctuaciones del mercado.`
      },

      {
        tipo: "multiple",
        enunciado: `El sistema financiero en Colombia lo componen:`,
        opciones: [
          "El mercado monetario y financiero.",
          "El mercado de capitales y el mercado financiero.",
          "El mercado monetario, mercado de capitales, mercado de divisas.",
          "El mercado monetario, mercado de capitales, mercado de divisas y otros mercados financieros."
        ],
        correcta: 3,
        realimentacion: `El sistema financiero colombiano está conformado por diversos mercados que facilitan la intermediación de recursos y el desarrollo de la economía. Entre ellos se encuentran el mercado monetario, destinado a operaciones de corto plazo; el mercado de capitales, orientado a la financiación e inversión de mediano y largo plazo; el mercado de divisas, donde se negocian monedas extranjeras; y otros mercados financieros, como el de derivados y productos estructurados. Todos estos mercados funcionan de manera articulada bajo la supervisión de la Superintendencia Financiera de Colombia.`
      },

      {
        tipo: "multiple",
        enunciado: `Blockchain es:`,
        opciones: [
          "Una fintech de servicios financieros.",
          "Una tecnología utilizada por algunas fintech.",
          "Son los mismos criptoactivos.",
          "Es un sistema de programación."
        ],
        correcta: 1,
        realimentacion: `Blockchain es una tecnología de registro distribuido que permite almacenar información de forma segura, descentralizada e inmutable. Aunque es la base tecnológica de muchas criptomonedas, no es sinónimo de criptoactivos ni constituye una empresa fintech. Actualmente, numerosas fintech utilizan blockchain para optimizar procesos como pagos digitales, transferencias internacionales, contratos inteligentes, trazabilidad de operaciones y validación de información, incrementando la transparencia y la seguridad de las transacciones.`
      },

      {
        tipo: "vf",
        enunciado: `Las fintech tienen regulación propia en Colombia:`,
        opciones: [
          "Verdadero",
          "Falso"
        ],
        correcta: 1,
        realimentacion: `En Colombia no existe una ley única y exclusiva que regule a todas las fintech. Su regulación depende del tipo de actividad que desarrollen (pagos electrónicos, crowdfunding, financiación colaborativa, activos virtuales, entre otros). Dependiendo del servicio prestado, estas empresas pueden estar sujetas a normas expedidas por la Superintendencia Financiera de Colombia, la Superintendencia de Sociedades, la Unidad de Regulación Financiera (URF) u otras entidades competentes. Esto ha permitido impulsar la innovación sin descuidar la protección del consumidor financiero y la estabilidad del sistema.`
      },

      {
        tipo: "vf",
        enunciado: `La Superintendencia Financiera tiene la función de supervisar y controlar el sistema financiero en Colombia.`,
        opciones: [
          "Verdadero",
          "Falso"
        ],
        correcta: 0,
        realimentacion: `La Superintendencia Financiera de Colombia (SFC) es la entidad encargada de inspeccionar, vigilar y supervisar las instituciones que conforman el sistema financiero y el mercado de valores. Su labor consiste en promover la estabilidad, seguridad y transparencia del sistema, proteger los derechos de los consumidores financieros, prevenir riesgos financieros y verificar el cumplimiento de las normas que regulan las actividades de las entidades vigiladas.`
      },

      {
        tipo: "vf",
        enunciado: `El leasing es un contrato de arrendamiento.`,
        opciones: [
          "Verdadero",
          "Falso"
        ],
        correcta: 0,
        realimentacion: `El leasing o arrendamiento financiero es un contrato mediante el cual una entidad financiera entrega un bien para su uso y disfrute durante un período determinado, a cambio del pago de cánones periódicos. Al finalizar el contrato, el arrendatario generalmente puede ejercer una opción de compra, renovar el contrato o devolver el bien. Este mecanismo es ampliamente utilizado por personas y empresas para financiar la adquisición de maquinaria, equipos, vehículos e inmuebles sin realizar un desembolso inicial elevado.`
      }

    ];



    /* =====================================
       VARIABLES
    ====================================== */

    let indiceActual = 0;
    let puntaje = 0;
    let respondida = false;


    /* =====================================
       ELEMENTOS
    ====================================== */

    const areaQuiz = document.getElementById("areaQuiz");
    const contador = document.getElementById("contador");
    const progresoBarra = document.getElementById("progresoBarra");
    const instruccion = document.getElementById("instruccion");
    const pregunta = document.getElementById("pregunta");
    const opciones = document.getElementById("opciones");
    const realimentacion = document.getElementById("realimentacion");
    const estado = document.getElementById("estado");
    const textoRealimentacion = document.getElementById("textoRealimentacion");
    const siguiente = document.getElementById("siguiente");
    const resultadoFinal = document.getElementById("resultadoFinal");
    const puntajeFinal = document.getElementById("puntaje");
    const mensajeResultado = document.getElementById("mensajeResultado");
    const reiniciar = document.getElementById("reiniciar");


    /* =====================================
       CARGAR EJERCICIO
    ====================================== */

    function cargarEjercicio() {

      respondida = false;

      const ejercicio = ejercicios[indiceActual];

      /* Contador */
      contador.textContent = `${indiceActual + 1} de ${ejercicios.length}`;

      /* Barra de progreso */
      const progreso = ((indiceActual) / ejercicios.length) * 100;
      progresoBarra.style.width = progreso + "%";

      /* Pregunta con número */
      pregunta.innerHTML =
        `<span class="pregunta-numero">${indiceActual + 1}</span>${ejercicio.enunciado}`;

      /* Instrucción según tipo */
      if (ejercicio.tipo === "vf") {
        instruccion.textContent = "Seleccione Verdadero o Falso.";
      } else {
        instruccion.textContent = "Seleccione la respuesta correcta.";
      }

      /* Limpiar opciones */
      opciones.innerHTML = "";

      /* Letras para cada opción */
      const letras = ["A", "B", "C", "D"];

      ejercicio.opciones.forEach((texto, indice) => {

        const boton = document.createElement("button");

        boton.type = "button";
        boton.className = "opcion";

        boton.setAttribute("data-letra", letras[indice] || "•");

        boton.textContent = texto;

        boton.addEventListener("click", () => {
          responder(indice, boton);
        });

        opciones.appendChild(boton);

      });

      /* Ocultar realimentación */
      realimentacion.classList.remove("visible");
      siguiente.classList.remove("visible");

      /* Texto del botón */
      if (indiceActual === ejercicios.length - 1) {
        siguiente.innerHTML = `Ver resultado <span>→</span>`;
      } else {
        siguiente.innerHTML = `Siguiente <span>→</span>`;
      }

    }


    /* =====================================
       RESPONDER
    ====================================== */

    function responder(indiceSeleccionado, botonSeleccionado) {

      if (respondida) return;

      respondida = true;

      const ejercicio = ejercicios[indiceActual];
      const botones = opciones.querySelectorAll(".opcion");

      botones.forEach(boton => {
        boton.disabled = true;
      });

      const esCorrecta = indiceSeleccionado === ejercicio.correcta;

      if (esCorrecta) {

        botonSeleccionado.classList.add("correcta");
        estado.textContent = "¡Respuesta correcta!";
        estado.className = "estado correcto";
        puntaje++;

      } else {

        botonSeleccionado.classList.add("incorrecta");
        botones[ejercicio.correcta].classList.add("correcta");

        estado.textContent = "Respuesta incorrecta";
        estado.className = "estado incorrecto";

      }

      textoRealimentacion.textContent = ejercicio.realimentacion;

      realimentacion.classList.add("visible");
      siguiente.classList.add("visible");

    }


    /* =====================================
       SIGUIENTE
    ====================================== */

    siguiente.addEventListener("click", () => {

      indiceActual++;

      if (indiceActual < ejercicios.length) {
        cargarEjercicio();
      } else {
        mostrarResultado();
      }

    });


    /* =====================================
       RESULTADO FINAL
    ====================================== */

    function mostrarResultado() {

      areaQuiz.style.display = "none";
      resultadoFinal.classList.add("visible");

      /* Barra al 100% */
      progresoBarra.style.width = "100%";

      puntajeFinal.textContent = `${puntaje}/${ejercicios.length}`;

      const porcentaje = Math.round((puntaje / ejercicios.length) * 100);

      /* Mensaje según rendimiento */
      let mensaje = "";

      if (porcentaje === 100) {
        mensaje = "¡Excelente! Dominas completamente los temas. 🎯";
      } else if (porcentaje >= 80) {
        mensaje = `Obtuviste ${porcentaje}% de respuestas correctas. ¡Muy buen trabajo!`;
      } else if (porcentaje >= 50) {
        mensaje = `Obtuviste ${porcentaje}% de respuestas correctas. Repasa los temas fallidos.`;
      } else {
        mensaje = `Obtuviste ${porcentaje}% de respuestas correctas. Te recomendamos volver a estudiar el material.`;
      }

      mensajeResultado.textContent = mensaje;

    }


    /* =====================================
       REINICIAR
    ====================================== */

    reiniciar.addEventListener("click", () => {

      indiceActual = 0;
      puntaje = 0;
      respondida = false;

      resultadoFinal.classList.remove("visible");
      areaQuiz.style.display = "block";

      cargarEjercicio();

    });


    /* =====================================
       INICIO
    ====================================== */

    cargarEjercicio();

  </script>

</body>
</html>
